name: Filament Compatibility

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        filament: ['^3.0', '^4.0', '^5.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies for matrix target
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts --with "filament/filament:${{ matrix.filament }}"

      - name: Lint PHP files
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
