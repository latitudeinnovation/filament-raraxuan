name: Filament Compatibility

on:
  push:
    branches:
      - 3.x
  pull_request:

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Lint PHP files
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
